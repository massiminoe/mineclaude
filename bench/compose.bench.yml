# Bench overlay: merged on top of the base docker-compose.yml to turn the dev
# stack into one scored benchmark run.
#
#   docker compose -f docker-compose.yml -f bench/compose.bench.yml [-f docker-compose.arm64.yml] ...
#
# Driven by bench/run.sh — don't `up` this by hand unless debugging. It
# (a) pins the world seed + difficulty on mc-server, (b) redirects recordings
# and session logs into a per-run artifacts dir (BENCH_RUN_DIR), and (c) adds
# the two bench-only services: the containerized mineclaude runtime and the
# harness. The harness sits behind a compose profile so the runner can bring
# the world up first and start the clock precisely when the agent starts.
services:
  mc-server:
    environment:
      # Fixed seed: every benchmark run generates the identical world, so no
      # score variance is attributable to world luck. Bump the default only
      # with a scoring-table version bump — cross-seed scores don't compare.
      SEED: "${BENCH_SEED:-mineclaude-bench-1}"
      # The dev stack runs peaceful; the bench needs hostile mobs for the
      # combat/adventure advancement tree to be earnable.
      DIFFICULTY: "${BENCH_DIFFICULTY:-normal}"

  mc-client:
    environment:
      # The dev stack records at 5 fps; the bench records at 15. Measured on a
      # c7i.2xlarge (bench/aws): 5 fps captures ~3.6 visually-distinct frames a
      # second and 15 fps captures ~7.3 — i.e. 5 fps samples BELOW what the
      # software renderer paints and throws motion away, which matters when the
      # video is being read to explain what a model did. The cost is 5 points of
      # one core (10.9% vs 5.9%) against an MC client already burning 250-440%,
      # and bytes are a wash since duplicate frames compress to nothing.
      # Override with RECORD_FPS in the environment; keep it low on an emulated
      # (Apple Silicon) client, where the headroom isn't there.
      RECORD_FPS: "${RECORD_FPS:-15}"
    volumes:
      # Same container target as the base file's ./state/video mapping, so
      # this *replaces* it: recordings land in the per-run artifacts dir.
      - "${BENCH_RUN_DIR:-./state/bench/dev}/video:/recordings"

  mineclaude:
    build:
      context: .
      dockerfile: bench/mineclaude.Dockerfile
    depends_on:
      - mc-client
    environment:
      BRIDGE_URL: http://mc-client:8081
      BRIDGE_WS_URL: ws://mc-client:8082/events
      MCP_HOST: "0.0.0.0"
      # How long `execute` blocks inline before handing back status:"running".
      # It must stay UNDER the harness's MCP tool-call timeout or a long action
      # is lost to the client rather than backgrounded. The MCP TypeScript SDK
      # (what opencode and Cursor use as the client) defaults to 60s, so the
      # 50s default has little headroom once server overhead is counted — the
      # non-Claude harnesses lower it via BENCH_EXECUTE_WAIT_S.
      MINECLAUDE_EXECUTE_WAIT_S: "${BENCH_EXECUTE_WAIT_S:-50}"
    ports:
      - "5555:5555" # monitor (watch a live run from the host)
      - "5556:5556" # MCP (debug against the same server the harness drives)
    volumes:
      - "${BENCH_RUN_DIR:-./state/bench/dev}/sessions:/app/state/sessions"

  # One service, N harness images: BENCH_HARNESS picks which Dockerfile under
  # bench/harness/ gets built. The build context is the shared bench/harness dir
  # so every image gets the same prompt.md + common.sh — see bench/README.md for
  # the contract. Keeping ONE service name is deliberate: run.sh's ps/logs/stop
  # logic addresses `harness` and needs no per-harness branching.
  harness:
    profiles: ["harness"]
    build:
      context: bench/harness
      dockerfile: "${BENCH_HARNESS:-claude-code}/Dockerfile"
      args:
        BENCH_HARNESS_VERSION: "${BENCH_HARNESS_VERSION:-latest}"
    depends_on:
      - mineclaude
    environment:
      MCP_URL: http://mineclaude:5556/mcp
      BENCH_HARNESS: "${BENCH_HARNESS:-claude-code}"
      BENCH_MODEL: "${BENCH_MODEL:-claude-haiku-4-5-20251001}"
      BENCH_RUN_SECONDS: "${BENCH_RUN_SECONDS:-3600}"
      # The superset of harness auth; each image reads only its own and fails
      # fast if that one is empty.
      # claude-code: subscription token (claude setup-token) or API key.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # opencode: Zen / Go subscription key (the provider is part of the model
      # id, e.g. opencode-go/qwen3.8-flash).
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-}"
      # cursor: dashboard -> API Keys; usage draws on the account's plan.
      CURSOR_API_KEY: "${CURSOR_API_KEY:-}"
    volumes:
      - ./skills:/skills:ro
      - ./bench/scoring:/scoring:ro
      - "${BENCH_RUN_DIR:-./state/bench/dev}/harness:/artifacts"
