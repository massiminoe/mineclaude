name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The Codex usage collector's unit tests execute Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -c requirements-dev.lock -e '.[dev]'
      - run: make test
      - run: make skill-docs && git diff --exit-code -- skills/mineclaude
      - run: for script in bench/run.sh bench/validate-config.sh bench/aws/*.sh bench/aws/*.tpl bench/harness/*/entrypoint.sh; do bash -n "$script"; done
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon build
        working-directory: mc-mod
