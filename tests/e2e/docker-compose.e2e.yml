# Compose 2.24.4+ is required for !override. Each test session chooses its own
# project name; no development ports, bind mounts, or volumes are reused.
services:
  mc-server:
    environment:
      SEED: "-4077293573215000000"
      DIFFICULTY: "peaceful"
      GAMEMODE: "survival"
    ports: !reset []
    volumes: !override
      - e2e-world:/data
  mc-client:
    environment:
      RECORD_VIDEO: "0"
    ports: !override
      - "127.0.0.1::8081"
      - "127.0.0.1::8082"
    volumes: !override
      - hmc-assets:/headlessmc/HeadlessMC/run/assets
volumes:
  e2e-world:
